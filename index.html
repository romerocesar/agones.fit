<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Agones is a modern sports league management platform."
    />
    <meta name="theme-color" content="#081c15" />
    <title>Agones — Play. Compete. Win.</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="field-lines" aria-hidden="true">
        <span class="field-lines__circle"></span>
        <span class="field-lines__line"></span>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="./" aria-label="Agones home">
          <span class="brand__mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>AGONES</span>
        </a>

        <span class="nav__descriptor">League management, reimagined.</span>
      </nav>

      <section class="hero__content" aria-labelledby="hero-title">
        <p class="eyebrow">
          <span class="eyebrow__dot" aria-hidden="true"></span>
          Built for the whole league
        </p>

        <h1 id="hero-title">
          <span>Play.</span>
          <span>Compete.</span>
          <span class="accent">Win.</span>
        </h1>

        <div class="hero__footer">
          <p class="intro">
            One place to organize every team, schedule every game, and keep the
            season moving.
          </p>

          <div class="season" aria-label="Coming soon">
            <span class="season__label">Next season</span>
            <span class="season__value">Coming soon</span>
          </div>
        </div>
      </section>

      <p class="side-note" aria-hidden="true">From first whistle to final</p>
    </main>
  </body>
</html>
